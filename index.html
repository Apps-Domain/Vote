<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yes or No Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .box {
            width: 90%;
            max-width: 420px;
            background: #1f2937;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #createBtn {
            background: #22c55e;
            color: white;
        }

        #joinBtn {
            background: #3b82f6;
            color: white;
        }

        #startBtn {
            background: #f59e0b;
            color: white;
        }

        .hidden {
            display: none;
        }

        .room-code {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 6px;
            margin: 15px 0 25px;
            color: #facc15;
        }

        .player {
            background: #374151;
            padding: 12px;
            border-radius: 8px;
            margin: 7px 0;
            text-align: left;
        }

        #error {
            color: #f87171;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="box">

    <!-- LOBBY -->

    <div id="lobby">

        <h1>YES / NO</h1>

        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name"
            maxlength="20"
        >

        <button id="createBtn">
            CREATE ROOM
        </button>

        <input
            id="codeInput"
            type="text"
            placeholder="Enter room code"
            maxlength="6"
            style="text-transform: uppercase;"
        >

        <button id="joinBtn">
            JOIN ROOM
        </button>

        <div id="error"></div>

    </div>


    <!-- ROOM -->

    <div id="room" class="hidden">

        <h2>Game Lobby</h2>

        <p>Room Code:</p>

        <div
            id="roomCode"
            class="room-code">
        </div>

        <h3>Players</h3>

        <div id="players"></div>

        <button
            id="startBtn"
            class="hidden">
            START GAME
        </button>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        set,
        get,
        onValue,
        push
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    // FIREBASE CONFIG

    const firebaseConfig = {

        apiKey: "AIzaSyBcbawl8p6zhcjstmiDFJEO-m_z2U3hbQ",

        authDomain: "vote-yes-no.firebaseapp.com",

        projectId: "vote-yes-no",

        storageBucket: "vote-yes-no.firebasestorage.app",

        messagingSenderId: "47271525623",

        appId: "1:47271525623:web:83d516a692b6ad17f0e7f2",

        measurementId: "G-WML4PGYKRE"

    };


    // START FIREBASE

    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    // CURRENT PLAYER

    let roomId = "";

    let playerId = "";

    let host = false;


    // ELEMENTS

    const lobby =
        document.getElementById("lobby");

    const room =
        document.getElementById("room");

    const nameInput =
        document.getElementById("nameInput");

    const codeInput =
        document.getElementById("codeInput");

    const error =
        document.getElementById("error");

    const players =
        document.getElementById("players");

    const roomCode =
        document.getElementById("roomCode");

    const startBtn =
        document.getElementById("startBtn");


    // RANDOM ROOM CODE

    function createRoomCode() {

        const characters =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        let code = "";

        for (let i = 0; i < 6; i++) {

            code += characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];

        }

        return code;

    }


    // SHOW ERROR

    function showError(message) {

        error.textContent = message;

    }


    // CREATE ROOM

    document
        .getElementById("createBtn")
        .addEventListener("click", async () => {

            try {

                const name =
                    nameInput.value.trim();


                if (!name) {

                    showError(
                        "Enter your name first."
                    );

                    return;

                }


                const newRoom =
                    createRoomCode();


                roomId = newRoom;

                host = true;


                const roomReference =
                    ref(
                        database,
                        "rooms/" + roomId
                    );


                await set(
                    roomReference,
                    {

                        host: true,

                        started: false,

                        players: {}

                    }
                );


                const playerReference =
                    push(
                        ref(
                            database,
                            "rooms/" +
                            roomId +
                            "/players"
                        )
                    );


                playerId =
                    playerReference.key;


                await set(
                    playerReference,
                    {

                        name: name,

                        host: true

                    }
                );


                openRoom();


            } catch (e) {

                console.error(e);

                showError(
                    "Error: " + e.message
                );

            }

        });


    // JOIN ROOM

    document
        .getElementById("joinBtn")
        .addEventListener("click", async () => {

            try {

                const name =
                    nameInput.value.trim();


                const code =
                    codeInput.value
                    .trim()
                    .toUpperCase();


                if (!name) {

                    showError(
                        "Enter your name first."
                    );

                    return;

                }


                if (code.length !== 6) {

                    showError(
                        "Enter a 6-character room code."
                    );

                    return;

                }


                const roomReference =
                    ref(
                        database,
                        "rooms/" + code
                    );


                const snapshot =
                    await get(roomReference);


                if (!snapshot.exists()) {

                    showError(
                        "Room does not exist."
                    );

                    return;

                }


                roomId = code;

                host = false;


                const playerReference =
                    push(
                        ref(
                            database,
                            "rooms/" +
                            roomId +
                            "/players"
                        )
                    );


                playerId =
                    playerReference.key;


                await set(
                    playerReference,
                    {

                        name: name,

                        host: false

                    }
                );


                openRoom();


            } catch (e) {

                console.error(e);

                showError(
                    "Error: " + e.message
                );

            }

        });


    // OPEN ROOM

    function openRoom() {

        lobby.classList.add("hidden");

        room.classList.remove("hidden");

        roomCode.textContent = roomId;


        if (host) {

            startBtn.classList.remove("hidden");

        }


        listenForPlayers();

    }


    // SHOW PLAYERS

    function listenForPlayers() {

        const playersReference =
            ref(
                database,
                "rooms/" +
                roomId +
                "/players"
            );


        onValue(
            playersReference,
            (snapshot) => {

                players.innerHTML = "";


                const data =
                    snapshot.val();


                if (!data) {

                    return;

                }


                Object.values(data).forEach(
                    player => {

                        const div =
                            document.createElement(
                                "div"
                            );


                        div.className =
                            "player";


                        div.textContent =
                            player.name +
                            (
                                player.host
                                    ? " 👑"
                                    : ""
                            );


                        players.appendChild(div);

                    }
                );

            }
        );

    }


    // START GAME

    startBtn.addEventListener(
        "click",
        async () => {

            await set(
                ref(
                    database,
                    "rooms/" +
                    roomId +
                    "/started"
                ),
                true
            );

            alert(
                "The game will start here!"
            );

        }
    );

</script>

</body>
</html>
