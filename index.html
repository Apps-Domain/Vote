<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yes or No</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: #1f2937;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 40px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .create {
            background: #22c55e;
            color: white;
        }

        .join {
            background: #3b82f6;
            color: white;
        }

        .start {
            background: #f59e0b;
            color: white;
        }

        .hidden {
            display: none;
        }

        #players {
            text-align: left;
            margin-top: 20px;
        }

        .player {
            background: #374151;
            padding: 10px;
            margin: 6px 0;
            border-radius: 8px;
        }

        #roomCode {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #facc15;
        }

        #message {
            margin-top: 10px;
            color: #f87171;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOBBY -->
    <div id="lobby">

        <h1>YES / NO</h1>

        <input
            type="text"
            id="playerName"
            placeholder="Enter your name"
            maxlength="20"
        >

        <button class="create" onclick="createRoom()">
            CREATE ROOM
        </button>

        <hr>

        <input
            type="text"
            id="joinCode"
            placeholder="Enter room code"
            maxlength="6"
        >

        <button class="join" onclick="joinRoom()">
            JOIN ROOM
        </button>

        <p id="message"></p>

    </div>


    <!-- ROOM -->
    <div id="room" class="hidden">

        <h2>Game Lobby</h2>

        <p>Room Code</p>

        <div id="roomCode"></div>

        <h3>Players</h3>

        <div id="players"></div>

        <button
            id="startButton"
            class="start hidden"
            onclick="startGame()"
        >
            START GAME
        </button>

    </div>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        set,
        get,
        onValue,
        push
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    // YOUR FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyBcbawl8p6zhcjstmiDFJEO-m_z2U3hbQ",
        authDomain: "vote-yes-no.firebaseapp.com",
        projectId: "vote-yes-no",
        storageBucket: "vote-yes-no.firebasestorage.app",
        messagingSenderId: "47271525623",
        appId: "1:47271525623:web:83d516a692b6ad17f0e7f2",
        measurementId: "G-WML4PGYKRE"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);


    let currentRoom = "";
    let currentPlayer = "";
    let isHost = false;


    // Generate 6-character room code
    function generateRoomCode() {

        const characters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        let code = "";

        for (let i = 0; i < 6; i++) {
            code += characters.charAt(
                Math.floor(Math.random() * characters.length)
            );
        }

        return code;
    }


    // CREATE ROOM
    window.createRoom = async function () {

        const name =
            document.getElementById("playerName").value.trim();

        if (!name) {
            showMessage("Enter your name first!");
            return;
        }


        const roomCode = generateRoomCode();

        currentRoom = roomCode;

        currentPlayer = name;

        isHost = true;


        const roomRef =
            ref(db, "rooms/" + roomCode);


        await set(roomRef, {

            host: name,

            started: false,

            players: {

                [name]: {
                    name: name,
                    host: true
                }

            }

        });


        enterRoom();

    };


    // JOIN ROOM
    window.joinRoom = async function () {

        const name =
            document.getElementById("playerName").value.trim();

        const code =
            document.getElementById("joinCode").value
            .trim()
            .toUpperCase();


        if (!name) {
            showMessage("Enter your name first!");
            return;
        }


        if (code.length !== 6) {
            showMessage("Enter a valid 6-character room code!");
            return;
        }


        const roomRef =
            ref(db, "rooms/" + code);


        const snapshot =
            await get(roomRef);


        if (!snapshot.exists()) {

            showMessage("Room not found!");

            return;
        }


        currentRoom = code;

        currentPlayer = name;

        isHost = false;


        await set(
            ref(
                db,
                "rooms/" + code + "/players/" + name
            ),
            {
                name: name,
                host: false
            }
        );


        enterRoom();

    };


    // ENTER ROOM
    function enterRoom() {

        document
            .getElementById("lobby")
            .classList.add("hidden");


        document
            .getElementById("room")
            .classList.remove("hidden");


        document
            .getElementById("roomCode")
            .textContent = currentRoom;


        if (isHost) {

            document
                .getElementById("startButton")
                .classList.remove("hidden");

        }


        listenForPlayers();

    }


    // LISTEN FOR PLAYERS
    function listenForPlayers() {

        const playersRef =
            ref(
                db,
                "rooms/" +
                currentRoom +
                "/players"
            );


        onValue(playersRef, snapshot => {

            const players =
                snapshot.val() || {};


            const playersDiv =
                document.getElementById("players");


            playersDiv.innerHTML = "";


            Object.values(players).forEach(player => {

                const div =
                    document.createElement("div");


                div.className = "player";


                div.textContent =
                    player.name +
                    (player.host ? " 👑" : "");


                playersDiv.appendChild(div);

            });

        });

    }


    // START GAME
    window.startGame = async function () {

        if (!isHost) return;


        await set(
            ref(
                db,
                "rooms/" +
                currentRoom +
                "/started"
            ),
            true
        );


        alert("Game starting!");

    };


    function showMessage(text) {

        document
            .getElementById("message")
            .textContent = text;

    }

</script>

</body>
</html>
